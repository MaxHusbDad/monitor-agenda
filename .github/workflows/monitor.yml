name: monitor-agenda

on:
  schedule:
    # Los 5 min reales los da el trigger externo (cron-job.org vía API).
    # Este schedule queda solo como fallback por si el pinger externo falla.
    - cron: "*/59 * * * *"       # fallback cada 30 min (best-effort de GitHub)
  workflow_dispatch:              # gatillar a mano o vía API (trigger externo)
    inputs:
      forzar_resumen:
        description: "Forzar el envío del resumen en esta corrida"
        type: boolean
        default: false            # el ping externo NO fuerza resumen; tildar para prueba manual

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10           # 3 servicios + varios profesionales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Restaurar estado previo
        uses: actions/cache@v4
        with:
          path: estado.json
          # key único por corrida (siempre guarda uno nuevo); restore-keys toma el
          # más reciente. OJO: en el bloque `|`, un `#` NO es comentario, así que
          # abajo va SOLO el prefijo, sin comentario, o contamina la clave.
          key: estado-${{ github.run_id }}
          restore-keys: |
            estado-
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Ejecutar monitor
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_FLOWS: ${{ secrets.MONITOR_FLOWS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # En corridas manuales, respeta el checkbox; en el cron, no fuerza.
          MONITOR_FORZAR_RESUMEN: ${{ (github.event_name == 'workflow_dispatch' && inputs.forzar_resumen) && '1' || '0' }}
        run: python monitor.py
